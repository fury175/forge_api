version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/adapters/postgresql/queries"
    schema: "internal/adapters/postgresql/migrations"
    gen:
      go:
        package: "repo"
        out: "internal/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
